<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#55bdf0"/><stop offset=".58" stop-color="#a9ddf4"/><stop offset="1" stop-color="#e6f4df"/></linearGradient>
 <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#86c946"/><stop offset=".55" stop-color="#4ca034"/><stop offset="1" stop-color="#1f6822"/></linearGradient>
 <radialGradient id="leaf" cx=".35" cy=".25"><stop stop-color="#7dd25a"/><stop offset=".5" stop-color="#378d38"/><stop offset="1" stop-color="#15591e"/></radialGradient>
 <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b7772c"/><stop offset=".55" stop-color="#79501f"/><stop offset="1" stop-color="#4c2d10"/></linearGradient>
 <linearGradient id="barn" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#d85136"/><stop offset="1" stop-color="#8d281e"/></linearGradient>
 <filter id="shadow"><feDropShadow dx="0" dy="7" stdDeviation="5" flood-opacity=".28"/></filter>
 <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
</defs>
